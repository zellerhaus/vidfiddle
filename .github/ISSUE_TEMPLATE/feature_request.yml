name: Feature request
description: Suggest something Vidfiddle should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you're trying to do
      description: The job you want done, and where Vidfiddle gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: How you picture it working. Rough is fine.
  - type: checkboxes
    id: help
    attributes:
      label: Helping out
      options:
        - label: I'd be up for opening a pull request for this.
